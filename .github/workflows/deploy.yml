name: Deploy to VPS

on:
  push:
    branches:
      - trunk
  workflow_dispatch:

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e

            if [ ! -d "/var/www/osw/.git" ]; then
              git clone https://github.com/oscfcommunity/osweekend.git /var/www/osw
            fi

            cd /var/www/osw
            git fetch origin trunk
            git reset --hard origin/trunk

            # .env lives on the server (chmod 600) and is never committed.
            test -f .env || { echo "missing /var/www/osw/.env"; exit 1; }

            # The Strapi CMS and its database run under the separate compose
            # project "osw". Everything below is scoped to "osw-app" and must
            # never be given --remove-orphans, which would delete them.
            COMPOSE="docker compose -p osw-app"

            # Back up the application database before migrations run.
            mkdir -p /var/backups/osw
            docker exec -t osw_db pg_dump -U osw -Fc "${APP_DB_NAME:-osw_app}" \
              | gzip > "/var/backups/osw/app-pre-deploy-$(date +%F-%H%M).dump.gz" \
              || echo "no application database yet, skipping pre-deploy backup"

            $COMPOSE build

            # The legacy container was started with `docker run` and binds the
            # same host port, so it has to go before the compose app can bind it.
            if docker ps --format '{{.Names}}' | grep -qx osw; then
              docker stop osw && docker rm osw
            fi

            $COMPOSE run --rm migrate
            $COMPOSE up -d
            $COMPOSE ps
            docker image prune -f
