name: Deploy to VPS

on:
  push:
    branches:
      - trunk
  workflow_dispatch:

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e

            if [ ! -d "/var/www/osw/.git" ]; then
              git clone https://github.com/oscfcommunity/osweekend.git /var/www/osw
            fi

            cd /var/www/osw
            git fetch origin trunk
            git reset --hard origin/trunk

            # .env lives on the server (chmod 600) and is never committed.
            test -f .env || { echo "missing /var/www/osw/.env"; exit 1; }

            # Back up before any migration runs, so a bad migration is recoverable.
            mkdir -p /var/backups/osw
            docker compose exec -T db pg_dump -U osw -Fc osw \
              | gzip > "/var/backups/osw/pre-deploy-$(date +%F-%H%M).dump.gz" || \
              echo "no database yet, skipping pre-deploy backup"

            docker compose build
            docker compose run --rm migrate
            docker compose up -d --remove-orphans
            docker compose ps
            docker image prune -f
