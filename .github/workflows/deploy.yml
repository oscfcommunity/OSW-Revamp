name: Deploy to VPS

on:
  push:
    branches:
      - trunk

jobs:
  deploy:
    name: Build and deploy to VPS
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy repository to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          source: '.'
          target: ${{ secrets.VPS_TARGET_DIR }}

      - name: Run deployment commands on VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          script: |
            set -e
            cd "${{ secrets.VPS_TARGET_DIR }}"

            # Ensure Docker is available; build and restart container with the latest image
            IMAGE_NAME="${{ secrets.DOCKER_IMAGE_NAME || 'osw-frontend:latest' }}"

            # Build the image (use sudo if necessary)
            if command -v sudo >/dev/null 2>&1; then
              sudo docker build -t "$IMAGE_NAME" .
              sudo docker stop osw || true
              sudo docker rm osw || true
              sudo docker run -d --name osw -p 80:80 --restart unless-stopped "$IMAGE_NAME"
            else
              docker build -t "$IMAGE_NAME" .
              docker stop osw || true
              docker rm osw || true
              docker run -d --name osw -p 80:80 --restart unless-stopped "$IMAGE_NAME"
            fi
