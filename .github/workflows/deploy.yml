name: Deploy to VPS

on:
  push:
    branches:
      - trunk
  workflow_dispatch:      

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e

            # Clone if first time
            if [ ! -d "/var/www/osw/.git" ]; then
              git clone https://github.com/oscfcommunity/OSW-Revamp.git /var/www/osw
            fi

            cd /var/www/osw

            # Pull latest code (hard reset to always match remote)
            git fetch origin trunk
            git reset --hard origin/trunk

            # Build Docker image
            docker build -t osw .

            # Restart container
            docker stop osw || true
            docker rm osw || true

            docker run -d \
              --name osw \
              -p 3000:4321 \
              -e HOST=0.0.0.0 \
              -e PORT=4321 \
              --restart unless-stopped \
              osw